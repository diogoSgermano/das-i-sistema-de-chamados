<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Categorias')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid px-4 py-4">

    <div class="page-header d-flex align-items-center justify-content-between">
        <h1 th:text="${categoria != null ? 'Editar Categoria' : 'Nova Categoria'}">Categoria</h1>
        <a th:href="@{/categorias}" class="btn btn-secondary btn-sm">Voltar</a>
    </div>

    <div class="card" style="max-width: 560px;">
        <div class="card-body p-4">
            <form th:action="${categoria != null ? '/categorias/' + categoria.idCategoria + '/atualizar' : '/categorias'}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label">Nome</label>
                    <input type="text" name="nome" class="form-control"
                           th:value="${categoria?.nome}" required maxlength="100"
                           placeholder="Nome da categoria"/>
                </div>

                <div class="mb-4">
                    <label class="form-label">Descricao</label>
                    <textarea name="descricao" class="form-control" rows="3"
                              maxlength="255" placeholder="Descricao opcional"
                              th:text="${categoria?.descricao}"></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a th:href="@{/categorias}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
