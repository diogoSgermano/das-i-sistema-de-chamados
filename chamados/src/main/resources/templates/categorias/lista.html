<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Categorias')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid px-4 py-4">

    <div class="page-header d-flex align-items-center justify-content-between">
        <h1>Categorias</h1>
        <a th:href="@{/categorias/novo}" class="btn btn-primary btn-sm">Nova Categoria</a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0" th:if="${not #lists.isEmpty(categorias)}">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nome</th>
                        <th>Descricao</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cat : ${categorias}">
                        <td class="text-muted" th:text="${cat.idCategoria}"></td>
                        <td th:text="${cat.nome}"></td>
                        <td th:text="${cat.descricao != null and cat.descricao != '' ? cat.descricao : '-'}"></td>
                        <td class="text-end">
                            <a th:href="@{/categorias/{id}/editar(id=${cat.idCategoria})}"
                               class="btn btn-secondary btn-sm me-1">Editar</a>
                            <form th:action="@{/categorias/{id}/excluir(id=${cat.idCategoria})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('Confirma exclusao?')">
                                <button type="submit" class="btn btn-danger btn-sm">Excluir</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="p-4 text-muted text-center" th:if="${#lists.isEmpty(categorias)}">
                Nenhuma categoria cadastrada.
            </div>
        </div>
    </div>

</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
