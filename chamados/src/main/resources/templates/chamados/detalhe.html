<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Detalhe do Chamado')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid px-4 py-4">

    <div class="page-header d-flex align-items-center justify-content-between">
        <div>
            <h1 th:text="'#' + ${chamado.idChamado} + ' - ' + ${chamado.titulo}">Chamado</h1>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/chamados/{id}/editar(id=${chamado.idChamado})}"
               class="btn btn-secondary btn-sm">Editar</a>
            <a th:href="@{/chamados}" class="btn btn-secondary btn-sm">Voltar</a>
        </div>
    </div>

    <div class="row g-3">

        <!-- Coluna principal -->
        <div class="col-lg-8">

            <!-- Dados do chamado -->
            <div class="card mb-3">
                <div class="card-header">Informacoes</div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <div class="detail-label">Cliente</div>
                            <div class="detail-value" th:text="${chamado.clienteNome}"></div>
                        </div>
                        <div class="col-sm-6">
                            <div class="detail-label">Categoria</div>
                            <div class="detail-value" th:text="${chamado.categoriaNome}"></div>
                        </div>
                        <div class="col-sm-4">
                            <div class="detail-label">Prioridade</div>
                            <div class="detail-value">
                                <span class="badge"
                                      th:classappend="${chamado.prioridade.name() == 'CRITICA'} ? 'bg-danger' :
                                                      (${chamado.prioridade.name() == 'ALTA'} ? 'bg-warning text-dark' :
                                                      (${chamado.prioridade.name() == 'MEDIA'} ? 'bg-secondary' : 'bg-dark border'))"
                                      th:text="${chamado.prioridade}">
                                </span>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="detail-label">Status</div>
                            <div class="detail-value">
                                <span class="badge"
                                      th:classappend="${chamado.status.name() == 'FECHADO'} ? 'bg-dark border' :
                                                      (${chamado.status.name() == 'EM_ATENDIMENTO'} ? 'bg-secondary' :
                                                      (${chamado.status.name() == 'AGUARDANDO_CLIENTE'} ? 'bg-warning text-dark' : 'bg-dark border text-white'))"
                                      th:text="${chamado.status}">
                                </span>
                            </div>
                        </div>
                        <div class="col-sm-4">
                            <div class="detail-label">Tecnico</div>
                            <div class="detail-value" th:text="${chamado.tecnicoNome != null ? chamado.tecnicoNome : 'Nao atribuido'}"></div>
                        </div>
                        <div class="col-sm-6">
                            <div class="detail-label">Data de Abertura</div>
                            <div class="detail-value"
                                 th:text="${#temporals.format(chamado.dataAbertura, 'dd/MM/yyyy HH:mm')}">
                            </div>
                        </div>
                        <div class="col-sm-6" th:if="${chamado.dataFechamento != null}">
                            <div class="detail-label">Data de Fechamento</div>
                            <div class="detail-value"
                                 th:text="${#temporals.format(chamado.dataFechamento, 'dd/MM/yyyy HH:mm')}">
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="detail-label">Descricao</div>
                            <div class="detail-value" th:text="${chamado.descricao}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Comentarios -->
            <div class="card">
                <div class="card-header">Comentarios</div>
                <div class="card-body p-0">
                    <div class="p-3 text-muted text-center" id="semComentarios">
                        Nenhum comentario ainda.
                    </div>
                </div>
                <div class="card-footer p-3">
                    <form th:action="@{/chamados/{id}/comentarios(id=${chamado.idChamado})}"
                          method="post">
                        <div class="mb-2">
                            <input type="text" name="autor" class="form-control form-control-sm"
                                   placeholder="Seu nome" required maxlength="100"/>
                        </div>
                        <div class="mb-2">
                            <textarea name="texto" class="form-control form-control-sm" rows="2"
                                      placeholder="Adicionar comentario..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm">Comentar</button>
                    </form>
                </div>
            </div>

        </div>

        <!-- Coluna lateral: acoes -->
        <div class="col-lg-4">

            <!-- Atribuir tecnico -->
            <div class="card mb-3" th:if="${chamado.status.name() != 'FECHADO'}">
                <div class="card-header">Atribuir Tecnico</div>
                <div class="card-body p-3">
                    <form th:action="@{/chamados/{id}/atribuir-tecnico(id=${chamado.idChamado})}"
                          method="post">
                        <select name="tecnicoId" class="form-select form-select-sm mb-2" required>
                            <option value="">Selecione...</option>
                            <option th:each="t : ${tecnicos}"
                                    th:value="${t.idTecnico}"
                                    th:text="${t.nome}"
                                    th:selected="${chamado.tecnicoId != null and chamado.tecnicoId == t.idTecnico}">
                            </option>
                        </select>
                        <button type="submit" class="btn btn-primary btn-sm w-100">Atribuir</button>
                    </form>
                </div>
            </div>

            <!-- Alterar status -->
            <div class="card mb-3" th:if="${chamado.status.name() != 'FECHADO'}">
                <div class="card-header">Alterar Status</div>
                <div class="card-body p-3">
                    <form th:action="@{/chamados/{id}/alterar-status(id=${chamado.idChamado})}"
                          method="post">
                        <select name="status" class="form-select form-select-sm mb-2" required>
                            <option value="">Selecione...</option>
                            <option th:each="s : ${statusList}"
                                    th:value="${s}"
                                    th:text="${s}"
                                    th:selected="${chamado.status == s}">
                            </option>
                        </select>
                        <button type="submit" class="btn btn-primary btn-sm w-100">Alterar</button>
                    </form>
                </div>
            </div>

            <!-- Excluir -->
            <div class="card">
                <div class="card-body p-3">
                    <form th:action="@{/chamados/{id}/excluir(id=${chamado.idChamado})}"
                          method="post"
                          onsubmit="return confirm('Confirma exclusao do chamado?')">
                        <button type="submit" class="btn btn-danger btn-sm w-100">Excluir Chamado</button>
                    </form>
                </div>
            </div>

        </div>
    </div>

</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
