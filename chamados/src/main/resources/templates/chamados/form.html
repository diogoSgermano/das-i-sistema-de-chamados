<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Chamados')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid px-4 py-4">

    <div class="page-header d-flex align-items-center justify-content-between">
        <h1 th:text="${chamado != null ? 'Editar Chamado' : 'Novo Chamado'}">Chamado</h1>
        <a th:href="@{/chamados}" class="btn btn-secondary btn-sm">Voltar</a>
    </div>

    <div class="card" style="max-width: 680px;">
        <div class="card-body p-4">
            <form th:action="${chamado != null ? '/chamados/' + chamado.idChamado + '/atualizar' : '/chamados'}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label">Titulo</label>
                    <input type="text" name="titulo" class="form-control"
                           th:value="${chamado?.titulo}" required maxlength="150"
                           placeholder="Titulo do chamado"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descricao</label>
                    <textarea name="descricao" class="form-control" rows="4"
                              required placeholder="Descreva o problema..."
                              th:text="${chamado?.descricao}"></textarea>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-sm-4">
                        <label class="form-label">Prioridade</label>
                        <select name="prioridade" class="form-select" required>
                            <option value="">Selecione...</option>
                            <option th:each="p : ${prioridades}"
                                    th:value="${p}"
                                    th:text="${p}"
                                    th:selected="${chamado != null and chamado.prioridade == p}">
                            </option>
                        </select>
                    </div>
                    <div class="col-sm-4">
                        <label class="form-label">Cliente</label>
                        <select name="clienteId" class="form-select" required>
                            <option value="">Selecione...</option>
                            <option th:each="c : ${clientes}"
                                    th:value="${c.id}"
                                    th:text="${c.nome}"
                                    th:selected="${chamado != null and chamado.clienteId == c.id}">
                            </option>
                        </select>
                    </div>
                    <div class="col-sm-4">
                        <label class="form-label">Categoria</label>
                        <select name="categoriaId" class="form-select" required>
                            <option value="">Selecione...</option>
                            <option th:each="cat : ${categorias}"
                                    th:value="${cat.idCategoria}"
                                    th:text="${cat.nome}"
                                    th:selected="${chamado != null and chamado.categoriaId == cat.idCategoria}">
                            </option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Tecnico (opcional)</label>
                    <select name="tecnicoId" class="form-select">
                        <option value="">Sem tecnico</option>
                        <option th:each="t : ${tecnicos}"
                                th:value="${t.idTecnico}"
                                th:text="${t.nome}"
                                th:selected="${chamado != null and chamado.tecnicoId == t.idTecnico}">
                        </option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a th:href="@{/chamados}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
