<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid px-4 py-4">

    <div class="page-header d-flex align-items-center justify-content-between">
        <h1 th:text="${cliente != null ? 'Editar Cliente' : 'Novo Cliente'}">Cliente</h1>
        <a th:href="@{/clientes}" class="btn btn-secondary btn-sm">Voltar</a>
    </div>

    <div class="card" style="max-width: 560px;">
        <div class="card-body p-4">
            <form th:action="${cliente != null ? '/clientes/' + cliente.id + '/atualizar' : '/clientes'}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label">Nome</label>
                    <input type="text" name="nome" class="form-control"
                           th:value="${cliente?.nome}" required maxlength="100"
                           placeholder="Nome completo"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" name="email" class="form-control"
                           th:value="${cliente?.email}" required maxlength="150"
                           placeholder="email@exemplo.com"/>
                </div>

                <div class="mb-4">
                    <label class="form-label">Telefone</label>
                    <input type="text" name="telefone" class="form-control"
                           th:value="${cliente?.telefone}" maxlength="20"
                           placeholder="(00) 00000-0000"/>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
