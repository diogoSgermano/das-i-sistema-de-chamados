<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body>
<link rel="stylesheet" th:href="@{/css/app.css}"><nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid px-4 py-4">

    <div class="page-header d-flex align-items-center justify-content-between">
        <h1>Clientes</h1>
        <a th:href="@{/clientes/novo}" class="btn btn-primary btn-sm">Novo Cliente</a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0" th:if="${not #lists.isEmpty(clientes)}">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${clientes}">
                        <td class="teste" th:text="${c.id}"></td>
                        <td th:text="${c.nome}"></td>
                        <td th:text="${c.email}"></td>
                        <td th:text="${c.telefone != null and c.telefone != '' ? c.telefone : '-'}"></td>
                        <td class="text-end">
                            <a th:href="@{/clientes/{id}/editar(id=${c.id})}"
                               class="btn btn-secondary btn-sm me-1">Editar</a>
                            <form th:action="@{/clientes/{id}/excluir(id=${c.id})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('Confirma exclusao?')">
                                <button type="submit" class="btn btn-danger btn-sm">Excluir</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="p-4 text-muted text-center" th:if="${#lists.isEmpty(clientes)}">
                Nenhum cliente cadastrado.
            </div>
        </div>
    </div>

</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
