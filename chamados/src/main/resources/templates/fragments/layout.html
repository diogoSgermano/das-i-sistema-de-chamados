<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${titulo} + ' | Sistema de Chamados'">Sistema de Chamados</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <style>
        :root {
            --bs-body-bg: #1a1a1a;
            --bs-body-color: #e0e0e0;
        }
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .navbar {
            background-color: #111111 !important;
            border-bottom: 1px solid #2e2e2e;
        }
        .navbar-brand, .nav-link {
            color: #e0e0e0 !important;
        }
        .nav-link:hover, .nav-link.active {
            color: #ffffff !important;
        }
        .card {
            background-color: #242424;
            border: 1px solid #2e2e2e;
            color: #e0e0e0;
        }
        .card-header {
            background-color: #1e1e1e;
            border-bottom: 1px solid #2e2e2e;
            color: #ffffff;
        }
        .table {
            color: #e0e0e0;
        }
        .table thead th {
            background-color: #1e1e1e;
            color: #aaaaaa;
            border-color: #2e2e2e;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .table tbody tr {
            border-color: #2e2e2e;
        }
        .table tbody tr:hover {
            background-color: #2a2a2a;
        }
        .table td {
            vertical-align: middle;
            border-color: #2e2e2e;
        }
        .form-control, .form-select {
            background-color: #2a2a2a;
            border-color: #3a3a3a;
            color: #e0e0e0;
        }
        .form-control:focus, .form-select:focus {
            background-color: #2a2a2a;
            border-color: #555555;
            color: #e0e0e0;
            box-shadow: 0 0 0 0.2rem rgba(100, 100, 100, 0.25);
        }
        .form-control::placeholder {
            color: #666666;
        }
        .form-label {
            color: #aaaaaa;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .btn-primary {
            background-color: #3a3a3a;
            border-color: #4a4a4a;
            color: #ffffff;
        }
        .btn-primary:hover {
            background-color: #4a4a4a;
            border-color: #5a5a5a;
        }
        .btn-secondary {
            background-color: #2a2a2a;
            border-color: #3a3a3a;
            color: #aaaaaa;
        }
        .btn-secondary:hover {
            background-color: #333333;
            border-color: #444444;
            color: #e0e0e0;
        }
        .btn-danger {
            background-color: #4a1a1a;
            border-color: #5a2020;
            color: #ffaaaa;
        }
        .btn-danger:hover {
            background-color: #5a2020;
            border-color: #6a2828;
        }
        .btn-outline-secondary {
            border-color: #3a3a3a;
            color: #aaaaaa;
        }
        .btn-outline-secondary:hover {
            background-color: #2a2a2a;
            border-color: #4a4a4a;
            color: #e0e0e0;
        }
        .btn-sm {
            font-size: 0.75rem;
        }
        .badge {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.03em;
        }
        .page-header {
            border-bottom: 1px solid #2e2e2e;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }
        .page-header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
            margin: 0;
        }
        .alert-dark {
            background-color: #242424;
            border-color: #3a3a3a;
            color: #aaaaaa;
        }
        .text-muted {
            color: #666666 !important;
        }
        .modal-content {
            background-color: #242424;
            border: 1px solid #2e2e2e;
            color: #e0e0e0;
        }
        .modal-header {
            border-bottom: 1px solid #2e2e2e;
        }
        .modal-footer {
            border-top: 1px solid #2e2e2e;
        }
        hr {
            border-color: #2e2e2e;
        }
        .detail-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #666666;
        }
        .detail-value {
            color: #e0e0e0;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-semibold" href="/">Sistema de Chamados</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/chamados}">Chamados</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/clientes}">Clientes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/tecnicos}">Tecnicos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/categorias}">Categorias</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
