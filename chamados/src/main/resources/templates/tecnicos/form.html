<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Tecnicos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid px-4 py-4">

    <div class="page-header d-flex align-items-center justify-content-between">
        <h1 th:text="${tecnico != null ? 'Editar Tecnico' : 'Novo Tecnico'}">Tecnico</h1>
        <a th:href="@{/tecnicos}" class="btn btn-secondary btn-sm">Voltar</a>
    </div>

    <div class="card" style="max-width: 560px;">
        <div class="card-body p-4">
            <form th:action="${tecnico != null ? '/tecnicos/' + tecnico.idTecnico + '/atualizar' : '/tecnicos'}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label">Nome</label>
                    <input type="text" name="nome" class="form-control"
                           th:value="${tecnico?.nome}" required maxlength="100"
                           placeholder="Nome completo"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" name="email" class="form-control"
                           th:value="${tecnico?.email}" required maxlength="120"
                           placeholder="email@exemplo.com"/>
                </div>

                <div class="mb-4">
                    <label class="form-label">Perfil</label>
                    <select name="perfil" class="form-select" required>
                        <option value="">Selecione...</option>
                        <option th:each="p : ${perfis}"
                                th:value="${p}"
                                th:text="${p}"
                                th:selected="${tecnico != null and tecnico.perfil == p}">
                        </option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a th:href="@{/tecnicos}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
